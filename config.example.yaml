# ============================================================
# Learn-Agent 配置模板
# 使用：复制本文件为 config.yaml 再按需修改 —— config.yaml 含本机
# 凭据，已被 .gitignore 忽略，切勿提交。未创建 config.yaml 时程序
# 会自动回退读取本模板（即可开箱运行）。
# ============================================================

project:
  name: learn-agent
  data_dir: data
  outputs_dir: data/outputs

local_model:
  provider: ollama
  base_url: http://localhost:11434
  fast_model: qwen3:8b        # 快速：聊天/学习/简单生成
  deep_model: qwen3:14b       # 深度：思考/规划/审查/写代码
  num_ctx: 8192
  temperature: 0.3
  think: false                # qwen3 思考模式总开关；深度环节会自动临时打开

external_model:               # OpenAI 兼容接口，用于能力增强（复杂审查/高质量蒸馏）
  enabled: false              # 拿到 Key 后改为 true 即自动启用
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 阿里云百炼示例 Key 形如 sk-xxx；也可换 deepseek: https://api.deepseek.com/v1
  api_key: "sk-在此填入你的KEY"
  model: qwen-plus
  timeout: 60

escalation:
  max_loop_rounds: 3          # 思考→计划→审查→开发→测试 循环上限
  escalate_after_failures: 2  # 连续失败 N 次后升级到外部模型(或深度+思考模式)
  review_block_on: high       # high 严重度问题会打回重做；medium/low 仅记录

web:
  search_enabled: true        # 网络数据检索（学习资料/题解参考）
  timeout: 10
  max_chars: 6000

database:                     # 本地 MySQL/MariaDB（Agent 的数据库工具与 SQL 学习用）
  host: 127.0.0.1
  port: 3306
  user: root
  password: "change-me"       # ← 真实密码只填在 config.yaml，不要写进任何入库文件
  max_rows: 50                # 查询结果最多返回行数

testing:
  timeout: 12                 # 单次运行测试的超时(秒)
  leak_rounds: 300            # 内存泄漏检测：重复调用次数
  leak_growth_bytes: 20480    # 判定泄漏的堆内存增长阈值(字节)
